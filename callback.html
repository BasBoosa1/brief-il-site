<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Brief.il TikTok</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><a href="index.html">Brief.il</a></header>
  <h1 id="heading">חיבור TikTok</h1>
  <p id="message"></p>
  <div class="url" id="url" hidden></div>
  <button id="copy" hidden>העתקה</button>
</main>
<script>
const query = new URLSearchParams(location.search);
const error = query.get("error");
const message = document.getElementById("message");
if (error) {
  document.getElementById("heading").textContent = "החיבור נכשל";
  message.className = "error";
  message.textContent = error + (query.get("error_description") ? ": " + query.get("error_description") : "");
} else if (query.get("code")) {
  message.textContent = "החיבור אושר. העתיקו את הכתובת המלאה והדביקו אותה בחלון של npm run tiktok:auth.";
  const url = document.getElementById("url");
  url.textContent = location.href;
  url.hidden = false;
  const copy = document.getElementById("copy");
  copy.hidden = false;
  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(location.href);
    copy.textContent = "הועתק";
  });
} else {
  message.textContent = "דף זה מקבל את התשובה של TikTok אחרי אישור החיבור.";
}
</script>
</body>
</html>
